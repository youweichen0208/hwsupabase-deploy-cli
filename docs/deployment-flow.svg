<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title description">
  <title id="title">OBS 静态前端部署与 Supabase 接入架构</title>
  <desc id="description">项目源码在已有 CI、本地或构建容器生成静态产物并校验清单，通过 hcloud obs 上传到公开读 OBS 桶。入口域名由用户提供并提供 www 子域，两条托管路线二选一：入口域名直连桶并使用静态网站托管，或入口域名经 CDN 回源同一个公开桶并获得缓存与路径改写。创建入口后对根路径做一次 GET 探测，按状态码、HTML 类型、非附件与版本标记判定；通过则返回链接与证据，失败按阻塞、可修复、待生效三组归类。浏览器独立调用已有华为云 RDS Supabase 的 Auth、Data、Storage HTTPS API，API 不经过 OBS。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#536477" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="api-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#347d68" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #233648; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #596c7e; }
      .section { font-size: 15px; font-weight: 650; fill: #647487; }
      .heading { font-size: 20px; font-weight: 650; }
      .body { font-size: 15px; fill: #4d6072; }
      .note { font-size: 14px; fill: #647487; }
      .node { stroke: #b8c8d4; stroke-width: 1.5; }
      .flow { fill: none; stroke: #536477; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .api-flow { fill: none; stroke: #347d68; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#api-arrow); }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#ffffff"/>
  <text x="60" y="65" class="title">OBS 静态前端架构</text>
  <text x="60" y="100" class="subtitle">入口域名直连桶或经 CDN 回源；创建入口后先探测再交付</text>

  <g id="build-and-publish">
    <text x="60" y="140" class="section">01  构建与发布</text>
    <rect x="60" y="158" width="300" height="86" rx="16" class="node" fill="#f1f5fa"/>
    <text x="84" y="192" class="heading">源码与边界</text>
    <text x="84" y="220" class="body">已有项目、实际路由与静态产物边界</text>

    <rect x="60" y="262" width="300" height="86" rx="16" class="node" fill="#f1f5fa"/>
    <text x="84" y="296" class="heading">构建环境</text>
    <text x="84" y="324" class="body">复用 CI、本地或容器冻结安装</text>

    <rect x="60" y="366" width="300" height="86" rx="16" class="node" fill="#f1f5fa"/>
    <text x="84" y="400" class="heading">产物与清单</text>
    <text x="84" y="428" class="body">dist、SHA-256、MIME 与缓存头</text>

    <rect x="60" y="470" width="300" height="86" rx="16" class="node" fill="#eef3f8"/>
    <text x="84" y="504" class="heading">hcloud obs 发布</text>
    <text x="84" y="532" class="body">先传不可变资源，入口最后上传</text>

    <path d="M 210 244 L 210 262" class="flow"/>
    <path d="M 210 348 L 210 366" class="flow"/>
    <path d="M 210 452 L 210 470" class="flow"/>
  </g>

  <g id="storage-and-entry">
    <text x="420" y="140" class="section">02  存储与入口</text>
    <rect x="420" y="158" width="380" height="86" rx="16" class="node" fill="#f1f5fa"/>
    <text x="444" y="192" class="heading">公开读 OBS 桶</text>
    <text x="444" y="220" class="body">匿名读对象；写与列举权限不开放</text>

    <rect x="420" y="262" width="380" height="86" rx="16" class="node" fill="#f1f5fa"/>
    <text x="444" y="296" class="heading">入口域名　www.&lt;根域&gt;</text>
    <text x="444" y="324" class="body">用户提供并已具备上线条件，不代注册</text>

    <rect x="420" y="366" width="380" height="76" rx="16" class="node" fill="#eaf3ef"/>
    <text x="444" y="396" class="heading">obs-domain（默认）</text>
    <text x="444" y="422" class="body">域名直连桶；静态网站托管，错误文档回落首页</text>

    <rect x="420" y="458" width="380" height="98" rx="16" class="node" fill="#f7f2e8"/>
    <text x="444" y="488" class="heading">obs-cdn（按需升级）</text>
    <text x="444" y="514" class="body">加速层回源同一公开桶</text>
    <text x="444" y="538" class="body">提供缓存、路径改写与负向路径 4xx</text>

    <path d="M 360 513 L 392 513 L 392 201 L 420 201" class="flow"/>
    <path d="M 610 244 L 610 262" class="flow"/>
    <path d="M 610 348 L 610 366" class="flow"/>
    <path d="M 610 442 L 610 458" class="flow"/>
  </g>

  <g id="probe-and-deliver">
    <text x="840" y="140" class="section">03  入口探测与交付</text>
    <rect x="840" y="158" width="380" height="86" rx="16" class="node" fill="#f1f5fa"/>
    <text x="864" y="192" class="heading">GET /　正常解析</text>
    <text x="864" y="220" class="body">按实际协议发请求，跟随跳转</text>

    <rect x="840" y="262" width="380" height="106" rx="16" class="node" fill="#f1f5fa"/>
    <text x="864" y="296" class="heading">判定条件</text>
    <text x="864" y="322" class="body">2xx · HTML 类型 · 非附件 · 版本标记</text>
    <text x="864" y="348" class="body">不用改 Host 或跳过证书校验</text>

    <rect x="840" y="386" width="380" height="86" rx="16" class="node" fill="#eaf3ef"/>
    <text x="864" y="420" class="heading">通过：返回链接与证据</text>
    <text x="864" y="448" class="body">状态码、最终 URL、版本、路线、时间</text>

    <rect x="840" y="490" width="380" height="106" rx="16" class="node" fill="#f7f2e8"/>
    <text x="864" y="524" class="heading">失败：归类不撤销资源</text>
    <text x="864" y="550" class="body">阻塞 · 可修复 · 待生效</text>
    <text x="864" y="576" class="body">保留资源与标识，等待后从查询续跑</text>

    <path d="M 800 404 L 820 404 L 820 201 L 840 201" class="flow"/>
    <path d="M 1030 244 L 1030 262" class="flow"/>
    <path d="M 1030 368 L 1030 386" class="flow"/>
    <path d="M 1030 472 L 1030 490" class="flow"/>
  </g>

  <g id="browser-and-backend">
    <text x="60" y="644" class="section">04  浏览器与后端</text>
    <rect x="60" y="662" width="300" height="86" rx="16" class="node" fill="#f1f5fa"/>
    <text x="84" y="696" class="heading">终端用户浏览器</text>
    <text x="84" y="724" class="body">打开入口域名，无需华为云账号</text>

    <rect x="420" y="662" width="380" height="86" rx="16" class="node" fill="#eaf3ef"/>
    <text x="444" y="696" class="heading">Supabase HTTPS API</text>
    <text x="444" y="724" class="body">Auth、Data、Storage 按实际启用能力</text>

    <path d="M 360 705 L 420 705" class="api-flow"/>
    <text x="840" y="696" class="note">API 不经过 OBS；HTTP 入口下 PKCE 登录</text>
    <text x="840" y="722" class="note">可能因缺少安全上下文而不可用，补证书后复验</text>
  </g>

  <g id="legend">
    <line x1="60" y1="812" x2="140" y2="812" class="flow"/>
    <text x="152" y="818" class="note">托管与发布流程</text>
    <line x1="360" y1="812" x2="440" y2="812" class="api-flow"/>
    <text x="452" y="818" class="note">浏览器到后端 API 的独立链路</text>
    <text x="60" y="856" class="note">路线、域名、证书与失败原因定义见 references/hosting.md 与 references/domain-provisioning.md；本图不表示任何已完成的云端验证。</text>
  </g>
</svg>
