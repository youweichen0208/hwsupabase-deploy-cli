<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1460" viewBox="0 0 1040 1460" role="img" aria-labelledby="title description">
  <title id="title">前端托管选择与华为云 Supabase 接入流程</title>
  <desc id="description">手绘风部署流程图。静态前端可保留其他平台托管、使用华为云 OBS 加 CDN，或明确选择 ECS 加 EIP；也可使用用户指定的其他云厂商或平台，Cloudflare Pages 和 Vercel 仅为操作示例。没有域名时可先本地预览，缺少域名不会自动购买 ECS。所有路线最终由浏览器调用已有 Supabase HTTPS API，并验收页面、资源、路由、登录与数据隔离。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1.5 L8 5 L1 8.5" fill="none" stroke="#89959D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1.5 L8 5 L1 8.5" fill="none" stroke="#4B77A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1.5 L8 5 L1 8.5" fill="none" stroke="#4D8672" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; text-rendering: optimizeLegibility; }
      .hand { font-family: "Kaiti SC", "STKaiti", "KaiTi", "PingFang SC", sans-serif; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 2.2px; fill: #4B77A0; }
      .title { font-size: 33px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #64727B; }
      .section { font-size: 21px; font-weight: 700; }
      .body { font-size: 18px; font-weight: 500; }
      .note { font-size: 14px; fill: #5D6B74; }
      .tiny { font-size: 12.5px; fill: #68757C; }
      .status { font-size: 12.5px; fill: #61717C; }
      .panel-neutral { fill: #FFFFFF; stroke: #D5D9D7; stroke-width: 1.3; }
      .panel-huawei { fill: #F6F9FC; stroke: #B8CCDE; stroke-width: 1.4; }
      .node-blue { fill: #F0F5FA; stroke: #4B77A0; stroke-width: 1.7; stroke-linejoin: round; }
      .node-green { fill: #EFF7F2; stroke: #4D8672; stroke-width: 1.8; stroke-linejoin: round; }
      .sketch-blue { fill: none; stroke: #4B77A0; stroke-width: 0.7; opacity: 0.24; stroke-linecap: round; }
      .sketch-green { fill: none; stroke: #4D8672; stroke-width: 0.7; opacity: 0.25; stroke-linecap: round; }
      .trunk { fill: none; stroke: #B5BEC2; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
      .connector { fill: none; stroke: #89959D; stroke-width: 1.55; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .route-line { fill: none; stroke: #4B77A0; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#blue-arrow); }
      .merge { fill: none; stroke: #A8B4BA; stroke-width: 1.45; stroke-linecap: round; stroke-linejoin: round; }
      .common-line { fill: none; stroke: #4D8672; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#green-arrow); }
    </style>
  </defs>

  <rect width="1040" height="1460" fill="#FCFBF7"/>

  <text x="64" y="34" class="eyebrow">DEPLOYMENT MAP</text>
  <text x="64" y="72" class="title hand">前端放哪里，用户怎么访问？</text>
  <text x="64" y="102" class="subtitle">托管路线 × 真实访问入口 × 已有 Supabase</text>
  <path d="M64 114 Q176 111 288 114" fill="none" stroke="#4B77A0" stroke-width="2" opacity="0.35" stroke-linecap="round"/>

  <g id="start">
    <path d="M318 126 Q520 123 722 126 Q733 127 731 139 L733 190 Q731 203 719 201 Q520 205 321 202 Q309 201 311 189 L309 139 Q310 126 318 126 Z" class="node-green"/>
    <path d="M323 130 Q520 127 716 130" class="sketch-green"/>
    <text x="520" y="159" class="body hand" text-anchor="middle">静态前端＋已有华为云 Supabase</text>
    <text x="520" y="185" class="note" text-anchor="middle">SSR / 服务端 API 需求需另行设计运行环境</text>
  </g>

  <path d="M520 205 V218 H42 V962" class="trunk"/>

  <g id="existing-platform">
    <path d="M78 238 Q520 235 962 238 Q976 239 974 253 L976 363 Q975 377 961 376 Q520 379 79 376 Q65 376 67 362 L64 253 Q65 239 78 238 Z" class="panel-neutral"/>
    <text x="92" y="270" class="section hand">01  已在其他平台托管</text>
    <text x="948" y="269" class="status" text-anchor="end">保留项目、域名与 CI</text>
  </g>
  <path d="M42 324 H90" class="connector"/>
  <g id="existing-site">
    <path d="M104 292 Q245 289 386 292 Q398 293 396 305 L398 343 Q396 355 384 354 Q245 357 105 354 Q93 354 95 342 L93 305 Q94 292 104 292 Z" class="node-blue"/>
    <path d="M109 296 Q245 293 381 296" class="sketch-blue"/>
    <text x="245" y="319" class="body hand" text-anchor="middle">已有前端访问地址</text>
    <text x="245" y="342" class="note" text-anchor="middle">确认当前用户可正常访问</text>
  </g>
  <path d="M400 324 Q478 320 554 324" class="route-line"/>
  <g id="keep-hosting">
    <path d="M568 292 Q750 289 932 292 Q944 293 942 305 L944 343 Q942 355 930 354 Q750 357 569 354 Q557 354 559 342 L557 305 Q558 292 568 292 Z" class="node-blue"/>
    <path d="M573 296 Q750 293 927 296" class="sketch-blue"/>
    <text x="750" y="319" class="body hand" text-anchor="middle">复用现有托管与发布方式</text>
    <text x="750" y="342" class="note" text-anchor="middle">只接入 Supabase，或按请求更新</text>
  </g>

  <g id="huawei">
    <path d="M78 402 Q520 399 962 402 Q976 403 974 417 L976 835 Q975 849 961 848 Q520 851 79 848 Q65 848 67 834 L64 417 Q65 403 78 402 Z" class="panel-huawei"/>
    <text x="92" y="434" class="section hand">02  选择华为云托管</text>
    <text x="948" y="433" class="status" text-anchor="end">按域名与访问入口选择路线</text>
  </g>

  <path d="M42 506 H90" class="connector"/>
  <g id="domain-ready">
    <path d="M104 470 Q205 467 306 470 Q318 471 316 483 L318 529 Q316 541 304 540 Q205 543 105 540 Q93 540 95 528 L93 483 Q94 470 104 470 Z" class="node-blue"/>
    <path d="M109 474 Q205 471 301 474" class="sketch-blue"/>
    <text x="205" y="512" class="body hand" text-anchor="middle">已有可用域名</text>
  </g>
  <path d="M320 506 H384" class="route-line"/>
  <g id="prerequisites">
    <path d="M398 460 Q515 457 632 460 Q644 461 642 473 L644 539 Q642 551 630 550 Q515 553 399 550 Q387 550 389 538 L387 473 Q388 460 398 460 Z" class="node-blue"/>
    <path d="M403 464 Q515 461 627 464" class="sketch-blue"/>
    <text x="515" y="499" class="body hand" text-anchor="middle">检查上线条件</text>
    <text x="515" y="526" class="note" text-anchor="middle">域名 · 证书 · 适用备案</text>
  </g>
  <path d="M646 506 H724" class="route-line"/>
  <g id="obs-cdn">
    <path d="M738 460 Q835 457 932 460 Q944 461 942 473 L944 539 Q942 551 930 550 Q835 553 739 550 Q727 550 729 538 L727 473 Q728 460 738 460 Z" class="node-blue"/>
    <path d="M743 464 Q835 461 927 464" class="sketch-blue"/>
    <text x="835" y="499" class="body hand" text-anchor="middle">私有 OBS＋CDN</text>
    <text x="835" y="526" class="note" text-anchor="middle">HTTPS 域名访问</text>
  </g>

  <path d="M42 620 H90" class="connector"/>
  <g id="domain-pending">
    <path d="M104 584 Q205 581 306 584 Q318 585 316 597 L318 643 Q316 655 304 654 Q205 657 105 654 Q93 654 95 642 L93 597 Q94 584 104 584 Z" class="node-blue"/>
    <path d="M109 588 Q205 585 301 588" class="sketch-blue"/>
    <text x="205" y="626" class="body hand" text-anchor="middle">准备办理域名</text>
  </g>
  <path d="M320 620 H384" class="route-line"/>
  <g id="local-preview">
    <path d="M398 574 Q515 571 632 574 Q644 575 642 587 L644 653 Q642 665 630 664 Q515 667 399 664 Q387 664 389 652 L387 587 Q388 574 398 574 Z" class="node-blue"/>
    <path d="M403 578 Q515 575 627 578" class="sketch-blue"/>
    <text x="515" y="613" class="body hand" text-anchor="middle">先本地构建与预览</text>
    <text x="515" y="640" class="note" text-anchor="middle">上线条件齐备后再继续</text>
  </g>
  <path d="M646 620 H835 V558" class="route-line"/>

  <path d="M92 688 Q515 685 948 688" fill="none" stroke="#D5DEE5" stroke-width="1.2" stroke-dasharray="3 7" stroke-linecap="round"/>
  <text x="92" y="710" class="note">不准备域名，且明确需要公网 IP 访问：</text>
  <path d="M42 764 H90" class="connector"/>
  <g id="ip-choice">
    <path d="M104 728 Q205 725 306 728 Q318 729 316 741 L318 787 Q316 799 304 798 Q205 801 105 798 Q93 798 95 786 L93 741 Q94 728 104 728 Z" class="node-blue"/>
    <path d="M109 732 Q205 729 301 732" class="sketch-blue"/>
    <text x="205" y="770" class="body hand" text-anchor="middle">选择服务器托管</text>
  </g>
  <path d="M320 764 H384" class="route-line"/>
  <g id="ecs">
    <path d="M398 718 Q515 715 632 718 Q644 719 642 731 L644 797 Q642 809 630 808 Q515 811 399 808 Q387 808 389 796 L387 731 Q388 718 398 718 Z" class="node-blue"/>
    <path d="M403 722 Q515 719 627 722" class="sketch-blue"/>
    <text x="515" y="757" class="body hand" text-anchor="middle">ECS＋EIP＋Nginx</text>
    <text x="515" y="784" class="note" text-anchor="middle">服务器与带宽费用 · 日常维护</text>
  </g>
  <path d="M646 764 H724" class="route-line"/>
  <g id="ip-entry">
    <path d="M738 718 Q835 715 932 718 Q944 719 942 731 L944 797 Q942 809 930 808 Q835 811 739 808 Q727 808 729 796 L727 731 Q728 718 738 718 Z" class="node-blue"/>
    <path d="M743 722 Q835 719 927 722" class="sketch-blue"/>
    <text x="835" y="757" class="body hand" text-anchor="middle">公网 IP 访问</text>
    <text x="835" y="784" class="note" text-anchor="middle">HTTPS 需另行配置</text>
  </g>
  <text x="92" y="833" class="tiny">缺少域名 ≠ 自动购买 ECS；OBS 桶不能直接绑定 EIP。</text>

  <g id="new-platform">
    <path d="M78 874 Q520 871 962 874 Q976 875 974 889 L976 999 Q975 1013 961 1012 Q520 1015 79 1012 Q65 1012 67 998 L64 889 Q65 875 78 874 Z" class="panel-neutral"/>
    <text x="92" y="906" class="section hand">03  尚未托管，选择其他平台</text>
    <text x="948" y="905" class="status" text-anchor="end">通用流程 · 按实际能力执行</text>
  </g>
  <path d="M42 962 H90" class="connector"/>
  <g id="choose-platform">
    <path d="M104 930 Q245 927 386 930 Q398 931 396 943 L398 981 Q396 993 384 992 Q245 995 105 992 Q93 992 95 980 L93 943 Q94 930 104 930 Z" class="node-blue"/>
    <path d="M109 934 Q245 931 381 934" class="sketch-blue"/>
    <text x="245" y="957" class="body hand" text-anchor="middle">选择云厂商与托管服务</text>
    <text x="245" y="980" class="note" text-anchor="middle">核实入口、HTTPS 与回退能力</text>
  </g>
  <path d="M400 962 Q478 958 554 962" class="route-line"/>
  <g id="platform-deploy">
    <path d="M568 930 Q750 927 932 930 Q944 931 942 943 L944 981 Q942 993 930 992 Q750 995 569 992 Q557 992 559 980 L557 943 Q558 930 568 930 Z" class="node-blue"/>
    <path d="M573 934 Q750 931 927 934" class="sketch-blue"/>
    <text x="750" y="957" class="body hand" text-anchor="middle">部署并获得真实访问地址</text>
    <text x="750" y="980" class="note" text-anchor="middle">自有域名或平台提供的入口</text>
  </g>

  <path d="M946 324 H1004 M946 506 H1004 M946 764 H1004 M946 962 H1004 M1004 324 V962" class="merge"/>
  <path d="M1004 962 V1052 Q1004 1062 994 1062 H520 V1086" class="common-line"/>

  <g id="browser">
    <path d="M308 1092 Q520 1089 732 1092 Q744 1093 742 1105 L744 1161 Q742 1173 730 1172 Q520 1175 309 1172 Q297 1172 299 1160 L297 1105 Q298 1092 308 1092 Z" class="node-green"/>
    <path d="M313 1096 Q520 1093 727 1096" class="sketch-green"/>
    <text x="520" y="1126" class="body hand" text-anchor="middle">用户浏览器打开前端入口</text>
    <text x="520" y="1153" class="note" text-anchor="middle">无需登录华为云账号</text>
  </g>

  <path d="M520 1178 V1204" class="common-line"/>
  <text x="540" y="1198" class="tiny">浏览器直接调用业务 API</text>

  <g id="supabase">
    <path d="M238 1210 Q520 1207 802 1210 Q814 1211 812 1223 L814 1301 Q812 1313 800 1312 Q520 1315 239 1312 Q227 1312 229 1300 L227 1223 Q228 1210 238 1210 Z" class="node-green"/>
    <path d="M243 1214 Q520 1211 797 1214" class="sketch-green"/>
    <text x="520" y="1245" class="body hand" text-anchor="middle">已有 Supabase HTTPS API</text>
    <text x="520" y="1273" class="note" text-anchor="middle">公开 Key · CORS · 登录回调 · RLS</text>
    <text x="520" y="1298" class="tiny" text-anchor="middle">Secret / Service Role Key 与数据库密码不进入前端</text>
  </g>

  <path d="M520 1318 V1342" class="common-line"/>
  <g id="acceptance">
    <path d="M318 1348 Q520 1345 722 1348 Q734 1349 732 1361 L734 1397 Q732 1409 720 1408 Q520 1411 319 1408 Q307 1408 309 1396 L307 1361 Q308 1348 318 1348 Z" class="node-green"/>
    <path d="M323 1352 Q520 1349 717 1352" class="sketch-green"/>
    <text x="520" y="1385" class="body hand" text-anchor="middle">验收页面、资源、路由、登录与数据隔离</text>
  </g>

  <circle cx="70" cy="1435" r="4" fill="#4B77A0"/>
  <text x="82" y="1440" class="tiny">托管路线</text>
  <circle cx="176" cy="1435" r="4" fill="#4D8672"/>
  <text x="188" y="1440" class="tiny">浏览器与 Supabase 链路</text>
  <text x="948" y="1440" class="tiny" text-anchor="end">流程覆盖不等于已完成云端验收</text>
</svg>
