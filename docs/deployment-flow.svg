<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1660" viewBox="0 0 1040 1660" role="img" aria-labelledby="title description">
<title id="title">前端托管选择与华为云 Supabase 接入流程</title>
<desc id="description">静态前端可保留其他平台托管、使用华为云 OBS 加 CDN，或明确选择 ECS 加 EIP。没有域名时可先本地预览或使用其他平台默认域名，不会自动购买 ECS。当前 skill 完整覆盖 OBS/CDN 流程，其他路线仅供选型。所有路线最终由浏览器调用已有 Supabase HTTPS API。</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#76818d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#2766a2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    text { font-family: "Kaiti SC", "STKaiti", "KaiTi", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #243447; }
    .title { font-size: 32px; font-weight: 700; }
    .section { font-size: 25px; font-weight: 700; }
    .body { font-size: 22px; }
    .note { font-size: 18px; fill: #596776; }
    .blue { fill: #2766a2; }
    .connector { fill: none; stroke: #76818d; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .supported { stroke: #2766a2; marker-end: url(#blue-arrow); }
  </style>
</defs>
<rect width="1040" height="1660" fill="#ffffff"/>

<text x="64" y="58" class="title" text-anchor="start">前端放哪里，用户怎么访问？</text>
<text x="64" y="92" class="note" text-anchor="start">部署选择 × 访问入口 × 已有 Supabase</text>
