[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hwsupabase-skills"
version = "0.1.0"
description = "Delivery skills and checkpoint helpers for Huawei Cloud RDS Supabase applications"
requires-python = ">=3.9"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
obs = ["esdk-obs-python==3.26.6"]

[project.scripts]
hwsupabase = "hwsupabase.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
